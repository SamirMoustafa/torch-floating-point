name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:latest

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Free disk space
      run: |
        docker system prune -af
        df -h

    - name: Build and test with Docker
      run: |
        # Build with BuildKit and caching
        docker buildx build \
          --platform linux/amd64 \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache,mode=max \
          --tag torch-floating-point:latest \
          --file Dockerfile \
          .
        
        # Clean up any temporary files to free disk space
        docker system prune -f

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff linter
      run: |
        ruff check .

    - name: Run Ruff formatter
      run: |
        ruff format --check .

  fp-codec-goldens:
    name: FP codec goldens
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install C++ toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential

    - name: Install CPU torch and package
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install pytest parameterized
        pip install --no-build-isolation -e .

    - name: Check explorer JS against goldens
      run: python scripts/check_fp_codec.py

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt

    - name: Build documentation
      run: mkdocs build --strict

  trigger-docs:
    name: Trigger Documentation Build
    runs-on: ubuntu-latest
    needs: [build-docs, build]
    if: needs.build.outputs.exists == 'false'
    steps:
    - name: Trigger Read the Docs build
      run: |
        if [ -z "${{ secrets.READTHEDOCS_API_TOKEN }}" ]; then
          echo "::error::Read the Docs API token not configured!"
          echo "::error::Please add READTHEDOCS_API_TOKEN secret to enable automatic builds."
          echo "::error::Get your token from: https://readthedocs.org/accounts/tokens/"
          exit 1
        fi
        echo "Triggering Read the Docs build..."
        response=$(curl -s -w "\n%{http_code}" -X POST https://readthedocs.org/api/v3/projects/torch-floating-point/versions/latest/builds/ \
          -H "Authorization: token ${{ secrets.READTHEDOCS_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{}')
        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')
        if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ] || [ "$http_code" -eq 202 ]; then
          echo "Read the Docs build triggered successfully! (HTTP $http_code)"
          echo "$body" | jq '.' 2>/dev/null || echo "$body"
        else
          echo "::error::Read the Docs build trigger failed with HTTP $http_code"
          echo "$body"
          exit 1
        fi
      continue-on-error: true

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check_version.outputs.exists }}
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-build-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-build-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch setuptools wheel twine

    - name: Build package
      run: python setup.py sdist bdist_wheel

    - name: Check if version exists on PyPI
      id: check_version
      run: |
        PACKAGE_NAME="torch-floating-point"
        CURRENT_VERSION=$(python version.py)
        http_code=$(curl -sS -o /dev/null -w "%{http_code}" \
          "https://pypi.org/pypi/${PACKAGE_NAME}/${CURRENT_VERSION}/json")
        if [ "$http_code" -eq 200 ]; then
          echo "Version ${CURRENT_VERSION} already exists on PyPI, skipping upload."
          echo "exists=true" >> $GITHUB_OUTPUT
        elif [ "$http_code" -eq 404 ]; then
          echo "Version ${CURRENT_VERSION} does not exist on PyPI, proceeding with upload."
          echo "exists=false" >> $GITHUB_OUTPUT
        else
          echo "::error::Unexpected PyPI response HTTP ${http_code} for ${PACKAGE_NAME}==${CURRENT_VERSION}"
          exit 1
        fi

    - name: Upload to PyPI
      if: steps.check_version.outputs.exists == 'false'
      run: python -m twine upload --verbose dist/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
